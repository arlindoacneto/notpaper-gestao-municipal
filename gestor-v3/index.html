<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex, nofollow"></head><body style="margin:0"><title>NotPaper Gestor</title>

<style>
/* Layout: barra lateral fixa (eixos e soluções) + área de trabalho com a tela padrão da solução; painéis laterais para detalhamento e Assessor IA */
:root {

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --side: #050C2C; --side-ink: #CFDAF5; --side-muted: #6E80B0;
  --accent: #5B97FF; --accent-ink: #06122E; --accent-soft: #17264D;
  --ok: #3CCB7F; --ok-soft: #0F2E21; --warn: #F2A43A; --warn-soft: #33240E; --bad: #FF6B6B; --bad-soft: #3A1518;
  --shadow: 0 8px 28px rgba(0,0,0,.45); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0A1022; --surface: #111A33; --surface2: #0E1630; --ink: #E8EEFB; --muted: #9BA9C8; --line: #24325A;
  --side: #050C2C; --side-ink: #CFDAF5; --side-muted: #6E80B0;
  --accent: #5B97FF; --accent-ink: #06122E; --accent-soft: #17264D;
  --ok: #3CCB7F; --ok-soft: #0F2E21; --warn: #F2A43A; --warn-soft: #33240E; --bad: #FF6B6B; --bad-soft: #3A1518;

html, body { height: 100%; }

.kpi span { font-size: 13.5px; color: var(--muted); }

.grid2 { margin-top: 18px; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.box { border-radius: 14px; border: 1px solid var(--line); background: var(--surface); padding: 18px 20px; min-width: 0; }
.box h3 { margin: 0 0 4px; font: 600 17px var(--f-display); }

.todo { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.todo li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 12px; border-radius: 11px; background: var(--surface2); border: 1px solid var(--line); }
.todo li > i { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font: 700 14px var(--f-display); font-style: normal; }

<script>
(function () {

    var dn = detNum(l), db = detBase(l); chk(soma(dn.linhas, "valor") === l.valor, l.id + ": analítico do numerador soma o numerador"); chk(soma(db.linhas, "valor") === l.base, l.id + ": analítico da base soma a base");
    dn.linhas.concat(db.linhas).forEach(function (x) { var d = x.det || (dn.onRow && !x.semClique ? null : null); if (x.det && x.det.linhas) chk(soma(x.det.linhas, "valor") === x.valor, l.id + ": " + x.nome + " soma"); }); });

  var loc = null; try { loc = JSON.parse(localStorage.getItem(mpChave()) || "null"); } catch (x) {}
  MP.itens = loc ? mpLimpa(loc) : mpPadrao();
  if (MP.db) { var pf = PERFIL; MP.unsub = MP.db.doc("perguntas/" + pf).onSnapshot(function (sn) { if (MP.perfil !== pf || !sn.exists) return; MP.itens = mpLimpa((sn.data() || {}).itens); mpRedesenha(); }, function () {}); }
}
function mpSalvar(itens) {

    MP.fila = MP.fila.then(function () { return doc.set(dados); }).catch(function () { MP.local = true; toast("Sem permissão para salvar para todos: a lista ficou salva só neste aparelho."); mpRedesenha(); }); }
}
function acharPlanejada(q) { var c = candidatas(); for (var i = 0; i < c.length; i++) if (c[i].p.q === q) return c[i].p; return null; }
function mpPerguntar(q) {

  if (pl) { var r = pl.a(); mostra(q, r.t || "Nada a apontar nesta base.", r.g, "Pergunta padrão · calculada da base de demonstração"); return; }

function mpTitulo() { return ehPref() ? "do prefeito(a)" : "da " + nomeSec(PERFIL); }

    else h += '<div class="mp-it"><button data-mpq="' + i + '">' + esc(x.q) + '</button><button class="mini" data-mped="' + i + '" aria-label="Editar pergunta" title="Editar">✎</button><button class="mini' + (MP.apagar === i ? " del-ok" : "") + '" data-mpdel="' + i + '" aria-label="Excluir pergunta" title="Excluir">' + (MP.apagar === i ? "Excluir?" : "🗑") + "</button></div>";
  });

  h += '</div><div class="mp-acts"><button class="btn" data-mpadd="1">+ Nova pergunta padrão</button><button class="mini" data-mpres="1">Restaurar sugeridas</button></div>';

}
function mpBind() {
  var box = document.getElementById("mpBox"); if (!box) return;
  box.querySelectorAll("[data-mpq]").forEach(function (b) { b.onclick = function () { mpPerguntar(MP.itens[+b.dataset.mpq].q); }; });
  box.querySelectorAll("[data-mped]").forEach(function (b) { b.onclick = function () { MP.editando = +b.dataset.mped; MP.apagar = null; mpRedesenha(); var i = document.getElementById("mpIn"); if (i) i.focus(); }; });

  box.querySelectorAll("[data-mpcan]").forEach(function (b) { b.onclick = function () { MP.editando = null; mpRedesenha(); }; });
  var ok = box.querySelector("[data-mpok]"), inp = document.getElementById("mpIn");
  function confirma() { var q = (inp.value || "").trim(); if (!q) { inp.focus(); return; } var n = MP.itens.slice();
    if (MP.editando === "novo") n.push({ id: "q" + Date.now().toString(36), q: q }); else n[MP.editando] = { id: n[MP.editando].id, q: q };
    var novo = MP.editando === "novo"; mpSalvar(n); toast(novo ? "Pergunta incluída como padrão." : "Pergunta atualizada."); }
  if (ok) ok.onclick = confirma;

}
function mpRedesenha() { var box = document.getElementById("mpBox"); if (box) { box.innerHTML = mpHtml(); mpBind(); } var nt = document.getElementById("mpNota"); if (nt) nt.outerHTML = mpNota(); }
function mpNota() { return '<p class="nota" id="mpNota"><b>Orientação:</b> cada perfil (prefeito e cada secretaria) tem a sua lista de <b>perguntas padrão</b>, que aparece primeiro sempre que o Assessor IA é aberto. Toque em <b>+ Nova pergunta padrão</b> para incluir as perguntas que você mais usa, em <b>✎</b> para editar e em <b>🗑</b> para excluir (toque de novo para confirmar). O <b>+</b> ao lado de uma pergunta planejada também a torna padrão. ' +
  (MP.db && !MP.local ? "A lista fica salva no Gestor para todos que usam este perfil." : "Nesta versão a lista fica salva somente neste aparelho.") + " Uma secretaria não vê as perguntas de outra.</p>"; }
var ctl = null;
function perguntar(qx) {
  var inp = document.getElementById("qIn"), q = (typeof qx === "string" ? qx : (inp && inp.value) || "").trim(); if (!q) return;
  var nt = document.getElementById("iaNote"); if (nt && /^(Entendi|Ouvindo)/.test(nt.textContent)) nt.textContent = "";
  if (!IA.sample) { responderLocal(q); return; }
  var out = document.getElementById("iaOut"); out.innerHTML = '<div class="resp"><div class="rq">' + esc(q) + '</div><div class="rt">Pensando… (lendo a base de ' + MUN.nome + ')</div><div class="ra"><button class="mini" id="parar">Parar</button></div></div>';
  ctl = new AbortController(); document.getElementById("parar").onclick = function () { ctl.abort(); };
  var prompt = "Você é o Assessor IA do NotPaper Gestor, falando com um prefeito ou secretário que nem sempre tem facilidade com sistemas.\n" +
    (ehPref() ? "Perfil: prefeito(a), com acesso a todo o município.\n" : "Perfil: " + nomeSec(PERFIL) + ". Os dados abaixo são só desta secretaria. Se perguntarem sobre outra secretaria ou sobre o município como um todo, responda que este perfil só tem acesso aos dados da " + nomeSec(PERFIL) + ".\n") +
    "Responda SOMENTE com base nos dados JSON abaixo (demonstração fictícia do município de " + MUN.nome + ", posição " + POS_TXT + "). Valores em reais.\n" +
    "Regras: 1) Comece pela resposta direta, em até 3 frases curtas, em português do Brasil, com o número que importa (use R$ x,x mi; percentuais com 1 casa). 2) Faça as contas com cuidado a partir dos dados (some, compare, calcule percentuais) e confira antes de responder. 3) Se a pergunta pedir comparação, ranking ou evolução, inclua um gráfico. 4) Se o dado não existir na base, diga claramente que essa informação não está na base de demonstração e sugira o que ela contém; nunca invente números. 5) Indique a fonte (qual tabela da base).\n" +
    'Responda apenas com um JSON: {"resposta": string, "grafico": null ou {"tipo": "barras" ou "colunas", "titulo": string, "rotulos": [strings], "valores": [números], "unidade": "reais" | "percentual" | "quantidade"}, "fonte": string, "fora_da_base": boolean}\n\n' +
    "PERGUNTA: " + q + "\n\nDADOS:\n" + JSON.stringify(baseIA());
  IA.sample.json(prompt, { signal: ctl.signal, modelTier: "default", effort: "low" }).then(function (r) {
    var g = null, f = r && r.grafico && r.grafico.unidade === "reais" ? mi : r && r.grafico && r.grafico.unidade === "percentual" ? function (v) { return pc(v); } : nf;
    if (r && r.grafico && Array.isArray(r.grafico.rotulos) && Array.isArray(r.grafico.valores) && r.grafico.rotulos.length === r.grafico.valores.length && r.grafico.valores.length) {

    }
    mostra(q, String((r && r.resposta) || "Sem resposta."), g, (r && r.fora_da_base ? "Fora da base de demonstração · " : "Resposta gerada pela IA · ") + "Fonte: " + String((r && r.fonte) || "base de demonstração"));
  }).catch(function (e) {
    var msg = { cancelled: "Pergunta cancelada.", not_granted: "O uso da IA não foi autorizado nesta página. Use as perguntas prontas.", rate_limited: "Muitas perguntas seguidas. Aguarde um minuto e tente de novo.", invalid_json: "A IA respondeu fora do formato. Tente reformular a pergunta.", session_expired: "Sua sessão do claude.ai expirou. Entre de novo.", sampling_disabled: "A IA não está disponível para esta conta." }[e && e.code] || "Não foi possível responder agora. Tente de novo.";

var rec = null;
function falar() {
  var b = document.getElementById("mic"), inp = document.getElementById("qIn"), note = document.getElementById("iaNote");

    if (IA.dict.active()) { IA.dict.stop(); return; }

  rec = new R(); rec.lang = "pt-BR"; rec.continuous = false; rec.interimResults = !IOS; rec.maxAlternatives = 1;
  rec.onstart = function () { note.textContent = "Ouvindo… fale a pergunta."; };

    solta(); };
